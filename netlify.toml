[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# `netlify dev` (not `npm run dev`/vite directly) is required for
# /.netlify/functions/* to resolve locally: plain `vite` on :5173 has no
# route for it at all, which is why SurveyComponent.tsx's fetch to
# /.netlify/functions/submit-survey 404s under `npm run dev`. This [dev]
# block tells Netlify Dev to run Vite itself (`command`) on its normal port
# and proxy everything through its own port (default 8888), serving the
# functions locally instead of leaving them unhandled.
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"
  functions = "netlify/functions"
  autoLaunch = false

[functions]
  node_bundler = "esbuild"

# submit-survey keeps its own package.json (separate dependency set, own
# lockfile) rather than pulling @supabase/supabase-js into the top-level
# app bundle. Netlify Build doesn't install a function's own dependencies
# by default, so this core plugin does that install step during the build.
[[plugins]]
  package = "@netlify/plugin-functions-install-core"
