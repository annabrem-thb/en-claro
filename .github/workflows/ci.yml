name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  checks:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      # onnxruntime-node (pulled in by @huggingface/transformers) downloads a
      # native binary in its install script. The app only runs it in the
      # browser, so skip the download instead of failing on network hiccups.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Netlify Function dependencies
      # netlify/functions/submit-survey has its own package.json/lockfile,
      # deliberately kept separate from the root so @supabase/supabase-js
      # never ends up in the frontend bundle (see netlify.toml's comment on
      # @netlify/plugin-functions-install-core, which installs this same
      # nested package.json during an actual Netlify build, but not here in
      # CI). Its own node_modules/ is gitignored like any other, so without
      # this step index.test.js's `require('./index.js')` — which requires
      # @supabase/supabase-js at the top of index.js — fails immediately.
      run: npm ci
      working-directory: netlify/functions/submit-survey
    - name: Lint
      run: npm run lint
    - name: Type check
      run: npm run typecheck
    - name: Check locale completeness
      run: npm run check:locales
    - name: Unit tests
      run: npm run test:run

  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # onnxruntime-node (pulled in by @huggingface/transformers) downloads a
      # native binary in its install script. The app only runs it in the
      # browser, so skip the download instead of failing on network hiccups.
      ONNXRUNTIME_NODE_INSTALL: skip
    strategy:
      fail-fast: false
      matrix:
        include:
        - project: Desktop Chrome
          browser: chromium
          slug: chrome
        - project: Desktop Firefox
          browser: firefox
          slug: firefox
        - project: Tablet (iPad)
          browser: webkit
          slug: ipad
        - project: Mobile (iPhone X)
          browser: webkit
          slug: iphone
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
    - name: Install Playwright browser
      if: steps.pw-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps ${{ matrix.browser }}
    - name: Install Playwright system dependencies
      if: steps.pw-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps ${{ matrix.browser }}
    - name: Run Playwright tests
      run: npx playwright test --project="${{ matrix.project }}"
    - uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.slug }}
        path: playwright-report/
        retention-days: 30
